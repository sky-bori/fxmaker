<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="점을 찍어 1·2·3차 함수를 만들고, 식을 그래프로 그리고, 퀴즈로 연습하는 초등 고학년용 함수 앱">
<title>f(x) 함수 찍기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* 배치: 어두운 책상 위에 펼침면. 왼쪽 쪽에 그래프판, 오른쪽 쪽에 함수 목록과 설명, 오른쪽 가장자리에 색인 탭. 좁은 화면에서는 쪽이 세로로 쌓임 */
:root{
  --fs:1;
  --desk:#2C312E; --desk-ink:#D9DED5; --desk-title:#F1F2EA; --desk-muted:#B4BCB2; --desk-line:#5A635D;
  --page:#EEEFE7; --paper:#FBFBF6; --ink:#1E2521; --muted:#566159; --rule:#C9CCC0; --rule-strong:#8E9588;
  --hl:#E1E4D7; --tab:#D2D5C8;
  --grid:#C9CDBF; --grid-major:#9AA194; --axis:#1E2521;
  --c1:#34508A; --c2:#B4563F; --c3:#3B8374;
  --accent:#A9741F; --accent-soft:#F1E7CF; --ribbon:#A9482F;
  --good:#2F7A4F; --good-soft:#DCEBDD; --bad:#B23A3A; --bad-soft:#F3DEDA; --focus:#2F6BFF;
  --display:'Lora','Nanum Myeongjo',serif;
  --body:'Lora','Gowun Batang',serif;
  --ui:'Gowun Dodum',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#0F1311; --desk-ink:#C9D0C7; --desk-title:#E9EEE6; --desk-muted:#98A39B; --desk-line:#3A443E;
    --page:#1B211E; --paper:#151A18; --ink:#E4E8E1; --muted:#9AA59E; --rule:#2F3934; --rule-strong:#55615A;
    --hl:#242C28; --tab:#2A332E;
    --grid:#27312C; --grid-major:#46534B; --axis:#D5DBD3;
    --c1:#8FAAE6; --c2:#E39A80; --c3:#7CC4B1;
    --accent:#E0B25A; --accent-soft:#3A3120; --ribbon:#C0654A;
    --good:#7FD3A0; --good-soft:#1C3326; --bad:#F0908A; --bad-soft:#3A2321; --focus:#8DB0FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#0F1311; --desk-ink:#C9D0C7; --desk-title:#E9EEE6; --desk-muted:#98A39B; --desk-line:#3A443E;
  --page:#1B211E; --paper:#151A18; --ink:#E4E8E1; --muted:#9AA59E; --rule:#2F3934; --rule-strong:#55615A;
  --hl:#242C28; --tab:#2A332E;
  --grid:#27312C; --grid-major:#46534B; --axis:#D5DBD3;
  --c1:#8FAAE6; --c2:#E39A80; --c3:#7CC4B1;
  --accent:#E0B25A; --accent-soft:#3A3120; --ribbon:#C0654A;
  --good:#7FD3A0; --good-soft:#1C3326; --bad:#F0908A; --bad-soft:#3A2321; --focus:#8DB0FF;
  color-scheme:dark;
}
/* 화면 안의 야간/주간 단추는 이 두 클래스로 색을 고정해요 */
.desk.night{
  --desk:#0F1311; --desk-ink:#C9D0C7; --desk-title:#E9EEE6; --desk-muted:#98A39B; --desk-line:#3A443E;
  --page:#1B211E; --paper:#151A18; --ink:#E4E8E1; --muted:#9AA59E; --rule:#2F3934; --rule-strong:#55615A;
  --hl:#242C28; --tab:#2A332E;
  --grid:#27312C; --grid-major:#46534B; --axis:#D5DBD3;
  --c1:#8FAAE6; --c2:#E39A80; --c3:#7CC4B1;
  --accent:#E0B25A; --accent-soft:#3A3120; --ribbon:#C0654A;
  --good:#7FD3A0; --good-soft:#1C3326; --bad:#F0908A; --bad-soft:#3A2321; --focus:#8DB0FF;
  color-scheme:dark;
}
.desk.day{
  --desk:#2C312E; --desk-ink:#D9DED5; --desk-title:#F1F2EA; --desk-muted:#B4BCB2; --desk-line:#5A635D;
  --page:#EEEFE7; --paper:#FBFBF6; --ink:#1E2521; --muted:#566159; --rule:#C9CCC0; --rule-strong:#8E9588;
  --hl:#E1E4D7; --tab:#D2D5C8;
  --grid:#C9CDBF; --grid-major:#9AA194; --axis:#1E2521;
  --c1:#34508A; --c2:#B4563F; --c3:#3B8374;
  --accent:#A9741F; --accent-soft:#F1E7CF; --ribbon:#A9482F;
  --good:#2F7A4F; --good-soft:#DCEBDD; --bad:#B23A3A; --bad-soft:#F3DEDA; --focus:#2F6BFF;
  color-scheme:light;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
:root{font-size:calc(16px * var(--fs))}
body{background:var(--desk);color:var(--ink);font:400 1rem/1.6 var(--body);padding-inline:16px;padding-block:0 32px}
h1,h2,h3,p,ul,figure{margin:0}
button,input{font-family:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
i{font-style:italic}

.desk{background:var(--desk);color:var(--desk-ink);display:flex;flex-direction:column;gap:18px;max-width:1216px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-top:16px}
.brand h1{font:700 1.625rem/1.2 var(--display);color:var(--desk-title);letter-spacing:.01em}
.brand p{margin-top:2px;font:400 .875rem/1.4 var(--ui);color:var(--desk-muted)}
.bar-act{display:flex;gap:6px}
.barbtn{min-height:44px;min-width:44px;padding:0 14px;background:transparent;border:1px solid var(--desk-line);color:var(--desk-ink);font:400 .9375rem var(--ui);cursor:pointer}
.barbtn:hover{border-color:var(--desk-ink)}
.barbtn[aria-pressed="true"]{background:var(--desk-ink);color:var(--desk);border-color:var(--desk-ink)}

.spread{position:relative;display:flex;flex-wrap:wrap;box-shadow:0 26px 60px rgba(0,0,0,.45)}
.page{position:relative;min-width:0;background:var(--page);color:var(--ink)}
.left{flex:1.5 1 560px;padding:28px 36px 36px;box-shadow:inset -26px 0 30px -26px rgba(0,0,0,.3)}
.right{flex:1 1 400px;padding:28px 36px 28px 36px;box-shadow:inset 26px 0 30px -26px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:12px}
.runhead{display:flex;justify-content:space-between;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--rule);font:400 .875rem var(--body);color:var(--muted)}
.left .runhead{margin-bottom:16px}
.ribbon{position:absolute;top:0;right:6px;width:26px;height:64px;background:var(--ribbon);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}

.barnote{align-self:center;font:400 .8125rem var(--ui);color:var(--desk-muted);max-width:260px;text-align:right}
.barnote:empty{display:none}
.barbtn.icon{min-width:44px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center}
.barbtn.icon .i-out{display:none}
.barbtn.icon[aria-pressed="true"] .i-out{display:block}
.barbtn.icon[aria-pressed="true"] .i-in{display:none}

/* 식 → 그래프: 네모 빈칸 */
.fslot{grid-template-columns:auto minmax(0,1fr) auto}
.fx-in{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px}
.eq{font:700 1.0625rem var(--display);margin-right:2px}
.tx{font:italic 700 1.0625rem var(--display);white-space:nowrap}
.tx sup{font-size:.6em;line-height:0;vertical-align:.7em}
.cf{width:46px;height:38px;padding:0;border:1.5px solid var(--rule-strong);background:var(--paper);color:var(--ink);text-align:center;font:700 1.0625rem var(--body);border-radius:0;-moz-appearance:textfield;appearance:textfield}
.cf::-webkit-inner-spin-button,.cf::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.k0 .cf{border-color:var(--c1)} .k1 .cf{border-color:var(--c2)} .k2 .cf{border-color:var(--c3)}
.cf.bad{border-color:var(--bad)!important;background:var(--bad-soft)}
.fslot .acts{flex-direction:column;gap:0;margin-left:0}
.vals{list-style:none;padding:0;display:flex;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.vals li{display:flex;align-items:center;font-variant-numeric:tabular-nums;flex:1;justify-content:center;gap:6px;border-bottom:0;border-right:1px solid var(--rule);padding:6px 4px;font:700 1rem var(--body)}
.vals li:last-child{border-right:0}
.vals .ico{width:20px;height:20px}
.vals .vnote{display:none}

/* 파일 탭 (책 위쪽에 항상 고정) */
.binder{display:flex;flex-direction:column}
.tabs{display:flex;align-items:flex-end;gap:2px;padding-left:16px;position:relative;z-index:1;margin-bottom:-1px}
.tab{position:relative;flex:0 1 auto;min-width:0;min-height:44px;margin-top:10px;padding:0 24px;border:0;background:var(--tab);color:var(--muted);font:400 1rem var(--body);letter-spacing:.06em;cursor:pointer;white-space:nowrap;clip-path:polygon(0 100%,14px 0,calc(100% - 14px) 0,100% 100%);transition:margin-top .12s,min-height .12s}
.tab:hover{color:var(--ink)}
.tab:focus-visible{outline-offset:-5px}
.tab[aria-selected="true"]{margin-top:0;min-height:54px;background:var(--page);color:var(--ink);font-weight:700;box-shadow:inset 0 4px 0 var(--accent)}
.nb{white-space:nowrap}
.tab .no{display:inline-block;margin-right:6px;font:700 .8125rem var(--ui);color:var(--accent);font-variant-numeric:tabular-nums}

/* 그래프 */
.frame{border:2px solid var(--ink);padding:6px;background:var(--paper)}
.frame svg{display:block;width:100%;height:auto;background:var(--paper);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.fig-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-top:10px}
.seg{display:flex;align-items:center;gap:6px;font:400 .875rem var(--ui);color:var(--muted)}
.seg button{min-height:40px;min-width:56px;padding:0 10px;background:transparent;border:1px solid var(--rule-strong);color:var(--ink);font:700 .9375rem var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:var(--ink)}
.cursor{font:700 .9375rem var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
figcaption{margin-top:10px;font:400 .9375rem/1.7 var(--body);color:var(--muted)}
figcaption b{font-family:var(--display);color:var(--ink)}

.grid{fill:none;stroke:var(--grid);stroke-width:1}
.grid.major{stroke:var(--grid-major);stroke-width:1.4}
.axis{fill:none;stroke:var(--axis);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tickmark{stroke:var(--axis);stroke-width:1.5}
.tick{font:700 16px var(--body);fill:var(--muted)}
.axname{font:italic 700 28px var(--display);fill:var(--ink)}
.curve{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.st0{stroke:var(--c1)} .st1{stroke:var(--c2)} .st2{stroke:var(--c3)}
.fl0{fill:var(--c1)} .fl1{fill:var(--c2)} .fl2{fill:var(--c3)}
.mk{stroke:var(--paper);stroke-width:1.5}
.ring{fill:none;stroke:var(--ink);stroke-width:1.8}
.guide{stroke:var(--accent);stroke-width:2;fill:none}
.guide.bad{stroke:var(--bad)}
.vline{stroke:var(--bad);stroke-width:2;fill:none}
.ghost-mk{fill:var(--ink);opacity:.3}
.hit{fill:none;pointer-events:all;cursor:grab;touch-action:none}
.lbl{font:700 19px var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:7px;stroke-linejoin:round}
.lbl.bad{fill:var(--bad)}
.lbl.soft{opacity:.6}
.tag{font:700 18px var(--ui);fill:var(--accent);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.qring{fill:var(--paper);stroke:var(--accent);stroke-width:1.75}
.qring.bad{stroke:var(--bad)}
.qgood{fill:var(--good);stroke:var(--paper);stroke-width:1}

/* 오른쪽 쪽 */
.panel{display:flex;flex-direction:column;gap:12px}
.panel[hidden]{display:none}
h2{font:800 1.5rem/1.3 var(--display);color:var(--ink)}
.lead{margin-top:4px;font:400 .9375rem/1.6 var(--body);color:var(--ink)}
.cap{margin-bottom:3px;font:400 .8125rem var(--body);color:var(--muted)}
.cap b{font-family:var(--display);color:var(--ink)}
.ex-note{font:400 .875rem/1.5 var(--ui);color:var(--ink);background:var(--accent-soft);padding:6px 12px}
.slots{list-style:none;padding:0;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.slot{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:0 8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--rule)}
.slot:last-child{border-bottom:0}
.slot.active{background:var(--hl)}
.slot.off .formula,.slot.off .ico{opacity:.4}
.sel{display:flex;align-items:center;justify-content:center;width:28px;height:36px;cursor:pointer}
.sel input{width:18px;height:18px;margin:0;accent-color:var(--ink)}
.ico{display:block;flex:none}
.ico text{font:800 14px var(--display);fill:var(--paper);text-anchor:middle}
.slot-main{min-width:0}
.formula{font:700 1.125rem/1.25 var(--display);overflow-wrap:anywhere}
.k0 .formula{color:var(--c1)} .k1 .formula{color:var(--c2)} .k2 .formula{color:var(--c3)}
.formula sup{font-size:.6em;line-height:0;vertical-align:.7em}
.empty{font:400 .875rem var(--ui);color:var(--muted)}
.warn{font:700 .875rem var(--ui);color:var(--bad)}
.meta{font:400 .75rem/1.4 var(--ui);color:var(--muted)}
.meta sup{font-size:.6em;line-height:0;vertical-align:.7em}
.slot-r2{grid-column:2 / -1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 8px}
.chips{display:flex;flex-wrap:wrap;gap:3px 5px;min-width:0}
.chip{display:inline-flex;align-items:center;padding-left:7px;border:1px solid var(--rule-strong);font:700 .8125rem var(--body);font-variant-numeric:tabular-nums}
.chip button{width:28px;height:28px;border:0;background:transparent;color:var(--muted);font:700 1.0625rem/1 var(--body);cursor:pointer}
.chip button:hover{color:var(--bad)}
.acts{display:flex;gap:2px;margin-left:auto}
.mini{white-space:nowrap;min-height:32px;padding:0 8px;background:transparent;border:0;color:var(--muted);font:400 .75rem var(--ui);text-decoration:underline;cursor:pointer}
.mini:hover{color:var(--ink)}
.nbox{border:1.5px dashed var(--rule-strong);padding:6px 12px;display:flex;flex-direction:column;gap:1px}
.nbox h3{font:800 .9375rem var(--display)}
.nrow{display:flex;justify-content:space-between;gap:12px;font:400 .875rem var(--body);font-variant-numeric:tabular-nums}
.nrow span:last-child{text-align:right}
.nnone{font:400 .8125rem var(--ui);color:var(--muted)}
.coord{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 12px}
.coord .ttl{align-self:center;font:800 1.125rem var(--display)}
.coord label{font:italic 700 1.125rem var(--display)}
.coord input{width:56px;min-height:40px;border:0;border-bottom:1.5px solid var(--ink);background:transparent;color:var(--ink);text-align:center;font:700 1.25rem var(--body);border-radius:0}
.btn{min-height:40px;padding:0 18px;background:var(--ink);color:var(--page);border:0;font:700 1rem var(--display);cursor:pointer}
.btn:hover{opacity:.88}
.ghost{min-height:38px;padding:0 12px;background:transparent;border:1.5px solid var(--rule-strong);color:var(--ink);font:400 .9375rem var(--ui);cursor:pointer}
.ghost:hover{border-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row3{font:800 1rem var(--display)}
.link{background:none;border:0;color:var(--muted);font:400 .875rem var(--ui);text-decoration:underline;cursor:pointer;min-height:44px;padding:0 6px}
.link:hover{color:var(--ink)}
.msg{font:400 .9375rem/1.5 var(--ui);color:var(--accent)}
.msg:empty{display:none}
.msg.err{color:var(--bad)}
input[type="range"]{width:100%;accent-color:var(--ink);height:32px}
.xnow{font:700 1.25rem var(--display)}

/* 퀴즈 */
.lvs{display:flex;gap:6px}
.ptm{fill:var(--ink);stroke:var(--paper);stroke-width:2}
.ptq{fill:var(--accent);stroke:var(--paper);stroke-width:2}
.big{font:800 1.5rem var(--display);color:var(--c1);white-space:nowrap}
.read{display:flex;flex-direction:column;gap:0;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);background:var(--hl);padding:6px 12px}
.read b{font:800 1.5rem var(--display);color:var(--c1)}
.read span{font:400 .875rem/1.5 var(--body)}
.lv,.sw{min-height:40px;min-width:56px;padding:0 12px;background:transparent;border:1px solid var(--rule-strong);color:var(--ink);font:700 .9375rem var(--body);cursor:pointer}
.lv[aria-pressed="true"],.sw[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:var(--ink)}
.q-prompt{font:800 1.125rem/1.45 var(--display)}
.q-formula{font:700 1.5rem/1.3 var(--display);background:var(--hl);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:6px 12px;color:var(--c1);overflow-wrap:anywhere}
.q-formula sup,.opt sup,.fb sup{font-size:.6em;line-height:0;vertical-align:.7em}
.q-tip{font:400 .8125rem/1.5 var(--ui);color:var(--muted)}
.q-tip:empty{display:none}
.q-answer{display:flex;align-items:flex-end;gap:10px}
.q-answer label{align-self:center;font:italic 700 1.125rem var(--display)}
.q-answer input{width:110px;min-height:44px;border:0;border-bottom:2px solid var(--ink);background:transparent;color:var(--ink);text-align:center;font:700 1.5rem var(--body);border-radius:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{min-height:46px;padding:6px 8px;background:var(--paper);color:var(--ink);border:1.5px solid var(--rule-strong);font:700 1.25rem/1.4 var(--display);cursor:pointer;min-width:0;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.good{border-color:var(--good);background:var(--good-soft);border-width:2.5px}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);border-width:2.5px}
.fb{padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb-h{font:800 1.0625rem var(--display)}
.fb.good .fb-h{color:var(--good)} .fb.bad .fb-h{color:var(--bad)}
.fb-a{font:700 1rem var(--body)}
.fb-c{font:400 .8125rem/1.5 var(--ui);color:var(--muted);font-variant-numeric:tabular-nums}

.foot{display:flex;align-items:center;gap:14px;font:400 .875rem var(--ui);color:var(--desk-muted)}
.track{flex:1;height:4px;background:var(--desk-line)}
.track i{display:block;height:100%;width:0;background:var(--desk-ink)}

@media (max-width:1000px){
  .left,.right{box-shadow:none}
}
@media (max-width:900px){
  .runhead{display:none}
  .desk{gap:10px}
  .bar{padding-top:10px}
  .brand p{display:none}
  .left{padding:14px 16px 12px}
  .right{padding:14px 16px 16px;gap:10px}
  .frame,.fig-tools{width:clamp(300px,58vh,100%);margin-inline:auto}
  .fig-tools{margin-top:6px}
  .ribbon{display:none}
  .tabs{padding-left:0}
  .tab{flex:1 1 0;padding:0 10px;letter-spacing:0;white-space:normal;line-height:1.25;font-size:.8125rem;clip-path:polygon(0 100%,8px 0,calc(100% - 8px) 0,100% 100%)}
  .tab .no{display:none}
  .spread[data-mode="quiz"] .right{order:-1}
}
@media (max-width:560px){
  .fslot{grid-template-columns:auto minmax(0,1fr)}
  .fslot .acts{grid-column:2;flex-direction:row;justify-content:flex-end}
  .cf{width:42px;height:36px}
  .tick{font-size:26px}
  .lbl{font-size:28px}
  .tag{font-size:26px}
  .axname{font-size:36px}
  .brand h1{font-size:1.375rem}
  .brand p{display:none}
  h2{font-size:1.5rem}
}
</style>

</head>
<body>
<div class="desk" id="app">
  <header class="bar">

<script>
(function(){
'use strict';
/*PURE-START*/
const fmt=n=>n<0?'−'+(-n):String(n);
function fmtNum(v){
  const r=Math.round(v);
  if(Math.abs(v-r)<1e-6) return fmt(r===0?0:r);
  return fmt(Math.round(v*100)/100);
}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a||1;}
function Fr(n,d){ if(d===undefined)d=1; if(d<0){n=-n;d=-d;} const g=gcd(n,d); return {n:n/g,d:d/g}; }
const fadd=(a,b)=>Fr(a.n*b.d+b.n*a.d,a.d*b.d);
const fsub=(a,b)=>Fr(a.n*b.d-b.n*a.d,a.d*b.d);
const fmul=(a,b)=>Fr(a.n*b.n,a.d*b.d);
const fdiv=(a,b)=>Fr(a.n*b.d,a.d*b.n);
const fz=a=>a.n===0;
const fnum=a=>a.n/a.d;
const fracText=a=>a.d===1?fmt(a.n):(a.n<0?'−':'')+Math.abs(a.n)+'/'+a.d;

function solvePoly(points){
  const n=points.length;
  const M=points.map(p=>{
    const row=[];
    for(let j=0;j<n;j++) row.push(Fr(Math.pow(p.x,j)));
    row.push(Fr(p.y));
    return row;
  });
  for(let col=0;col<n;col++){
    let piv=col;
    while(piv<n && fz(M[piv][col])) piv++;
    if(piv===n) return null;
    const tmp=M[col]; M[col]=M[piv]; M[piv]=tmp;
    const pv=M[col][col];
    M[col]=M[col].map(v=>fdiv(v,pv));
    for(let r=0;r<n;r++){
      if(r!==col && !fz(M[r][col])){
        const f=M[r][col];
        M[r]=M[r].map((v,k)=>fsub(v,fmul(f,M[col][k])));
      }
    }
  }
  return M.map(r=>r[n]);
}
function hornerN(cn,x){let s=0;for(let k=cn.length-1;k>=0;k--)s=s*x+cn[k];return s;}
function actualDegree(co){for(let k=co.length-1;k>=0;k--) if(!fz(co[k])) return k; return 0;}
function analyze(points){
  const n=points.length;
  if(n===0) return {kind:'none'};
  if(n===1) return {kind:'one'};
  const seen={}, dups=[];
  points.forEach(p=>{ if(seen[p.x] && !dups.includes(p.x)) dups.push(p.x); seen[p.x]=true; });
  if(dups.length) return {kind:'vertical',dups:dups,n:n};
  const co=solvePoly(points);
  return {kind:'poly',co:co,cn:co.map(fnum),deg:actualDegree(co),n:n};
}
function vertex(co){
  const a=co[2], b=co[1], c=co[0];
  const h=fdiv(fmul(Fr(-1),b),fmul(Fr(2),a));
  const k=fadd(fadd(fmul(a,fmul(h,h)),fmul(b,h)),c);
  return {h:h,k:k};
}
function fracHTML(n,d){return '<span class="frac"><span>'+n+'</span><span>'+d+'</span></span>';}
function polyHTML(co){
  const terms=[];
  for(let k=co.length-1;k>=0;k--){
    const c=co[k]; if(fz(c)) continue;
    const neg=c.n<0, an=Math.abs(c.n), d=c.d;
    const v=k===0?'':k===1?'x':'x<sup>'+k+'</sup>';
    let body;
    if(k===0) body=d===1?String(an):fracHTML(an,d);
    else if(d===1) body=(an===1?'':String(an))+v;
    else body=fracHTML(an,d)+v;
    terms.push({neg:neg,body:body});
  }
  if(!terms.length) return 'y = 0';
  let s='y = ';
  terms.forEach((t,i)=>{
    if(i===0) s+=(t.neg?'−':'')+t.body;
    else s+=' '+(t.neg?'−':'+')+' '+t.body;
  });
  return s;
}
const intPoly=co=>polyHTML(co.map(c=>Fr(c)));
function evalI(co,x){let s=0;for(let k=0;k<co.length;k++)s+=co[k]*Math.pow(x,k);return s;}
const coKey=co=>co.join(',');
function sup(k){return k===2?'²':k===3?'³':'';}
function substitution(co,x){
  const base=x<0?'('+fmt(x)+')':String(x);
  const terms=[];
  for(let k=co.length-1;k>=0;k--){
    const c=co[k]; if(c===0) continue;
    const ac=Math.abs(c);
    let t;
    if(k===0) t=String(ac);
    else { const pw=k===1?base:base+sup(k); t=ac===1?pw:ac+' × '+pw; }
    terms.push({neg:c<0,t:t});
  }
  if(!terms.length) return '0';
  return terms.map((o,i)=>i===0?(o.neg?'−':'')+o.t:' '+(o.neg?'−':'+')+' '+o.t).join('');
}

/* 식 읽기: 안전한 작은 계산기 (eval 사용 안 함) */
function parseExpr(src){
  let s=String(src).toLowerCase().replace(/\s+/g,'')
    .replace(/[−–—]/g,'-').replace(/[×·]/g,'*').replace(/÷/g,'/')
    .replace(/²/g,'^2').replace(/³/g,'^3').replace(/\*\*/g,'^');
  s=s.replace(/^y=/,'').replace(/^f\(x\)=/,'');
  if(!s) throw new Error('empty');
  const toks=[]; let i=0;
  while(i<s.length){
    const ch=s[i];
    if(/[0-9.]/.test(ch)){
      let j=i; while(j<s.length && /[0-9.]/.test(s[j])) j++;
      const v=Number(s.slice(i,j));
      if(!isFinite(v)) throw new Error('num');
      toks.push({t:'n',v:v}); i=j;
    } else if(ch==='x'){ toks.push({t:'x'}); i++; }
    else if('+-*/^()'.indexOf(ch)>=0){ toks.push({t:ch}); i++; }
    else throw new Error('char');
  }
  const out=[];
  for(let k=0;k<toks.length;k++){
    const a=toks[k-1], b=toks[k];
    if(a && (a.t==='n'||a.t==='x'||a.t===')') && (b.t==='n'||b.t==='x'||b.t==='(')) out.push({t:'*'});
    out.push(b);
  }
  let pos=0;
  const peek=()=>out[pos];
  function expr(){
    let l=term();
    while(peek() && (peek().t==='+'||peek().t==='-')){
      const op=out[pos++].t; const r=term(); const L=l;
      l=op==='+'?(x=>L(x)+r(x)):(x=>L(x)-r(x));
    }
    return l;
  }
  function term(){
    let l=unary();
    while(peek() && (peek().t==='*'||peek().t==='/')){
      const op=out[pos++].t; const r=unary(); const L=l;
      l=op==='*'?(x=>L(x)*r(x)):(x=>L(x)/r(x));
    }
    return l;
  }
  function unary(){
    const p=peek();
    if(p && p.t==='-'){ pos++; const u=unary(); return x=>-u(x); }
    if(p && p.t==='+'){ pos++; return unary(); }
    return power();
  }
  function power(){
    const b=atom();
    if(peek() && peek().t==='^'){ pos++; const e=unary(); return x=>Math.pow(b(x),e(x)); }
    return b;
  }
  function atom(){
    const p=out[pos++];
    if(!p) throw new Error('end');
    if(p.t==='n'){ const v=p.v; return ()=>v; }
    if(p.t==='x') return x=>x;
    if(p.t==='('){ const e=expr(); const q=out[pos++]; if(!q||q.t!==')') throw new Error('paren'); return e; }
    throw new Error('syntax');
  }
  const f=expr();
  if(pos<out.length) throw new Error('extra');
  return f;
}

/* 두 함수가 만나는 점 찾기 (부호가 바뀌는 곳을 이분법으로 좁힌다) */
function findIntersections(f,g,R){
  const N=Math.round(R*100), pts=[];
  const d=x=>{
    const a=f(x), b=g(x);
    return (isFinite(a)&&isFinite(b)&&Math.abs(a)<1e4&&Math.abs(b)<1e4)?a-b:NaN;
  };
  let prevX=-R, prevD=null, same=true, counted=0;
  for(let i=0;i<=N;i++){
    const x=-R+i*(2*R/N), v=d(x);
    if(!isFinite(v)){prevD=null;continue;}
    counted++;
    if(Math.abs(v)>1e-9) same=false;
    if(prevD!==null && (v===0 || (prevD<0&&v>0) || (prevD>0&&v<0))){
      let root;
      if(v===0) root=x;
      else{
        let a=prevX, b=x, fa=prevD;
        for(let k=0;k<60;k++){
          const m=(a+b)/2, fm=d(m);
          if(!isFinite(fm)) break;
          if((fa<0&&fm>0)||(fa>0&&fm<0)) b=m; else {a=m;fa=fm;}
        }
        root=(a+b)/2;
      }
      const dr=d(root);
      if(isFinite(dr) && Math.abs(dr)<1e-3){
        const y=f(root);
        if(isFinite(y) && !pts.some(p=>Math.abs(p.x-root)<1e-6)) pts.push({x:root,y:y});
      }
    }
    prevX=x; prevD=v;
  }
  return {same:same&&counted>0, pts:pts};
}
/*PURE-END*/

const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const ptStr=(x,y)=>'('+fmt(x)+', '+fmt(y)+')';
const ptNum=(x,y)=>'('+fmtNum(x)+', '+fmtNum(y)+')';

const svg=$('plot'), gGrid=$('gGrid'), gAxes=$('gAxes'), gCurve=$('gCurve'),
      gGuide=$('gGuide'), gPts=$('gPts'), gGhost=$('gGhost'), gHit=$('gHit');

/* ---------- 그래프판 ---------- */
const CX=400, CY=300;
let R=20, UX=19, UY=14;
const px=x=>CX+x*UX, py=y=>CY-y*UY;
const f1=v=>v.toFixed(1);

function drawStatic(){
  let minor='', major='';
  for(let n=-R;n<=R;n++){
    if(n===0) continue;
    const seg='M'+f1(px(n))+' 5V595M5 '+f1(py(n))+'H795';
    if(n%5===0) major+=seg; else minor+=seg;
  }
  gGrid.innerHTML='<path class="grid" d="'+minor+'"/><path class="grid major" d="'+major+'"/>';
  let a='<path class="axis" d="M5 '+CY+'H786M'+CX+' 595V10M770 290L786 '+CY+'L770 310M390 26L'+CX+' 10L410 26"/>';
  const step=R<=10?1:5;
  for(let n=step;n<=R;n+=step){
    const odd=(R<=10&&n%2===1)?' t-odd':'';
    [-1,1].forEach(sg=>{
      const v=n*sg;
      a+='<line class="tickmark" x1="'+f1(px(v))+'" y1="'+(CY-5)+'" x2="'+f1(px(v))+'" y2="'+(CY+5)+'"/>';
      a+='<text class="tick'+odd+'" x="'+f1(px(v))+'" y="'+(CY+22)+'" text-anchor="middle">'+fmt(v)+'</text>';
      a+='<line class="tickmark" x1="'+(CX-5)+'" y1="'+f1(py(v))+'" x2="'+(CX+5)+'" y2="'+f1(py(v))+'"/>';
      a+='<text class="tick'+odd+'" x="'+(CX-10)+'" y="'+f1(py(v)+5)+'" text-anchor="end">'+fmt(v)+'</text>';
    });
  }
  a+='<text class="tick" x="'+(CX-10)+'" y="'+(CY+22)+'" text-anchor="end">0</text>';
  a+='<text class="axname" x="788" y="'+(CY-14)+'" text-anchor="end">x</text>';
  a+='<text class="axname" x="'+(CX+16)+'" y="30">y</text>';
  gAxes.innerHTML=a;
}

function curvePath(f){
  const N=600, x0=-R-0.5, step=(2*R+1)/N;
  let d='', pen=false, prev=null;
  for(let i=0;i<=N;i++){
    const x=x0+i*step, y=f(x);
    if(!isFinite(y)||Math.abs(y)>1e4){pen=false;prev=null;continue;}
    if(prev!==null&&Math.abs(y-prev)>6*R) pen=false;
    d+=(pen?'L':'M')+f1(px(x))+' '+f1(py(y))+' ';
    pen=true; prev=y;
  }
  return d;
}

/* 이름표를 겹치지 않게 놓기 */
function placeLabels(items){
  const placed=[]; let out='';
  items.forEach(it=>{
    const w=it.text.length*9.2+8, h=20;
    const cx=px(it.x), cy=py(it.y);
    const cands=[[13,-12,'start'],[13,26,'start'],[-13,-12,'end'],[-13,26,'end'],[13,-34,'start'],[-13,-34,'end'],[13,48,'start']];
    for(let k=0;k<cands.length;k++){
      const dx=cands[k][0], dy=cands[k][1], an=cands[k][2];
      const x0=an==='start'?cx+dx:cx+dx-w, y0=cy+dy-h+4;
      if(x0<6||x0+w>794||y0<6||y0+h>594) continue;
      if(placed.some(p=>x0<p.x1&&x0+w>p.x0&&y0<p.y1&&y0+h>p.y0)) continue;
      placed.push({x0:x0,x1:x0+w,y0:y0,y1:y0+h});
      out+='<text class="lbl'+(it.cls?' '+it.cls:'')+'" x="'+f1(cx+dx)+'" y="'+f1(cy+dy)+'" text-anchor="'+an+'">'+it.text+'</text>';
      return;
    }
  });
  return out;
}

function computeInter(fs){
  const list=[]; let count=0;
  fs.forEach(f=>{if(f)count++;});
  for(let i=0;i<3;i++) for(let j=i+1;j<3;j++){
    if(fs[i]&&fs[j]) list.push({i:i,j:j,res:findIntersections(fs[i],fs[j],R)});
  }
  return {list:list,count:count};
}

const PT_MAX=12;
const pt={sub:'free',pts:[],last:null,level:1,score:0,total:0,streak:0,q:null,answered:false,first:true,wrong:null,revealed:false,picked:-1};
const inR=p=>Math.abs(p.x)<=R&&Math.abs(p.y)<=R;
function walkText(x,y){
  const a=x===0?'':(x>0?'오른쪽으로 '+x+'칸':'왼쪽으로 '+(-x)+'칸');
  const b=y===0?'':(y>0?'위로 '+y+'칸':'아래로 '+(-y)+'칸');
  const parts=[a,b].filter(Boolean);
  return parts.length?'가운데에서 '+parts.join(', ')+' 가면 돼요':'가운데(원점)예요';
}
function guideTo(x,y,cls){
  return '<path class="guide'+(cls?' '+cls:'')+'" d="M'+f1(px(x))+' '+f1(py(y))+'V'+CY+'M'+f1(px(x))+' '+f1(py(y))+'H'+CX+'"/>';
}
function ptNewQ(){
  const lo=pt.level===1?1:-10, hi=10;
  let x,y,tries=0;
  do{ x=rnd(lo,hi); y=rnd(lo,hi); tries++; }
  while((x===0&&y===0 || (pt.q&&pt.q.x===x&&pt.q.y===y)) && tries<50);
  const type=Math.random()<0.5?'place':'read';
  const q={type:type,x:x,y:y};
  if(type==='read'){
    const c=[[y,x],[-x,y],[x,-y],[x+1,y],[x,y+1],[x-1,y],[x,y-1],[-x,-y]];
    const seen={}; seen[x+','+y]=1; const ds=[];
    shuffle(c).forEach(d=>{
      const k=d[0]+','+d[1];
      if(seen[k]||Math.abs(d[0])>10||Math.abs(d[1])>10) return;
      if(pt.level===1 && (d[0]<1||d[1]<1)) return;
      seen[k]=1; ds.push(d);
    });
    let guard=0;
    while(ds.length<3 && guard++<200){
      const d=[rnd(lo,hi),rnd(lo,hi)], k=d[0]+','+d[1];
      if(!seen[k]){seen[k]=1;ds.push(d);}
    }
    const opts=shuffle([[x,y]].concat(ds.slice(0,3)));
    q.opts=opts; q.correct=opts.findIndex(o=>o[0]===x&&o[1]===y);
  }
  pt.q=q; pt.answered=false; pt.first=true; pt.wrong=null; pt.revealed=false; pt.picked=-1;
}
function ptResolve(ok){
  // 처음 시도에 맞혔을 때만 점수
  if(pt.answered) return;
  pt.answered=true; pt.total++;
  if(ok&&pt.first&&!pt.revealed){pt.score++;pt.streak++;} else pt.streak=0;
}

    :'<span>판을 눌러 보세요. 누른 점의 자리를 여기에서 읽어 드려요.</span>';
  $('ptChips').innerHTML=pt.pts.length

    :'<span class="empty" style="color:var(--muted);font:400 .875rem var(--ui)">아직 찍은 점이 없어요</span>';

function ptFree_toggle(x,y){
  const i=pt.pts.findIndex(p=>p.x===x&&p.y===y);

  if(pt.pts.length>=PT_MAX){ say('ptMsg','점은 '+PT_MAX+'개까지 찍을 수 있어요. ×로 지우거나 점을 다시 눌러 지워 보세요.'); return; }
  const p={x:x,y:y}; pt.pts.push(p); pt.last=p; render();

function renderPtQuiz(){

      labels.push({x:w.x,y:w.y,text:ptStr(w.x,w.y),cls:'bad'});

      } else {
        fb.className='fb good';
        fb.innerHTML='<div class="fb-h">'+(pt.first?'맞았어요!':'찾았어요!')+'</div><div class="fb-c">'+ptStr(q.x,q.y)+' : '+walkText(q.x,q.y)+'.</div>';
      }
    } else if(pt.wrong){
      fb.hidden=false; fb.className='fb bad';
      fb.innerHTML='<div class="fb-h">조금 달라요</div><div class="fb-c">찍은 곳은 '+ptStr(pt.wrong.x,pt.wrong.y)+'예요. '+ptStr(q.x,q.y)+'는 '+walkText(q.x,q.y)+'. 다시 눌러 보세요.</div>';
    }
  } else {
    prompt.textContent='노란 점의 자리는 어디일까요?';
    tip.textContent='(가로, 세로) 순서로 읽어요. 가운데에서 가로로 몇 칸, 세로로 몇 칸인지 세어 보세요.';
    opts.hidden=false;
    opts.innerHTML=q.opts.map((o,i)=>{
      let cls='opt';
      if(pt.answered){ if(i===q.correct) cls+=' good'; else if(i===pt.picked) cls+=' bad'; }
      return '<button type="button" class="'+cls+'" data-i="'+i+'"'+(pt.answered?' disabled':'')+'>'+ptStr(o[0],o[1])+'</button>';
    }).join('');

      fb.innerHTML='<div class="fb-h">'+(ok?'맞았어요!':'아쉬워요')+'</div><div class="fb-c">정답은 '+ptStr(q.x,q.y)+'예요. '+walkText(q.x,q.y)+'. x(가로)가 먼저, y(세로)가 나중이에요.</div>';
    } else labels.push({x:q.x,y:q.y,text:'?'});
  }
  gGuide.innerHTML=guide;
  gPts.innerHTML=pts+placeLabels(labels);
}
function ptTap(x,y){
  if(pt.sub==='free'){ ptFree_toggle(x,y); return; }

  if(q.type!=='place'||pt.answered) return;
  if(x===q.x&&y===q.y){ ptResolve(true); pt.wrong=null; }
  else { pt.wrong={x:x,y:y}; pt.first=false; }

}

/* ---------- 모드 2: 점 → 함수식 ---------- */
function mkSlot(arr){return {pts:arr.map(p=>({x:p[0],y:p[1]})),visible:true,a:{kind:'none'}};}
const EXS={line:[[0,1],[2,3]],parab:[[-2,3],[0,-1],[2,3]],cubic:[[-2,-2],[-1,2],[1,-2],[2,2]]};
const ex={fns:[mkSlot(EXS.line),mkSlot(EXS.parab),mkSlot([[0,1],[2,-1]])],active:0,example:true};
const NAMES=['상수함수','1차 함수','2차 함수','3차 함수'];

function factText(a){
  const co=a.co, d=a.deg;
  if(d===0) return '가로선';
  if(d===1) return '기울기 '+fracText(co[1])+' · y절편 '+fracText(co[0]);
  if(d===2){const v=vertex(co);return '꼭짓점 ('+fracText(v.h)+', '+fracText(v.k)+')';}
  return 'y절편 '+fracText(co[0]);
}
function exSlotHTML(i){
  const s=ex.fns[i], a=s.a, act=i===ex.active;
  let formula, meta;
  if(a.kind==='none'){formula='<span class="empty">비어 있어요</span>';meta='판을 눌러 점을 찍어요';}
  else if(a.kind==='one'){formula='<span class="empty">점이 1개예요</span>';meta='하나 더 찍으면 직선이 돼요';}
  else if(a.kind==='vertical'){formula='<span class="warn">함수가 아니에요</span>';meta='x가 같은 점이 있어요. 점 하나를 옮겨 보세요';}
  else {formula=polyHTML(a.co);meta=NAMES[a.deg]+' · '+factText(a);}
  const chips=s.pts.map((p,k)=>'<span class="chip">'+ptStr(p.x,p.y)+'<button type="button" data-f="'+i+'" data-k="'+k+'" aria-label="함수 '+(i+1)+'의 점 '+ptStr(p.x,p.y)+' 지우기">×</button></span>').join('');
  return '<li class="slot k'+i+(act?' active':'')+(s.visible?'':' off')+'" data-i="'+i+'">'+
    '<label class="sel"><input type="radio" name="exAct" value="'+i+'"'+(act?' checked':'')+' aria-label="함수 '+(i+1)+' 고르기"></label>'+
    icon(i)+
    '<div class="slot-main"><div class="formula">'+formula+'</div><div class="meta">'+meta+(act?' · 점 찍는 중':'')+'</div></div>'+
    '<div class="slot-r2"><div class="chips">'+chips+'</div><div class="acts">'+
      '<button type="button" class="mini" data-act="hide" data-i="'+i+'">'+(s.visible?'숨기기':'보이기')+'</button>'+
      '<button type="button" class="mini" data-act="clear" data-i="'+i+'">지우기</button></div></div></li>';
}
function syncHits(){
  const items=[];
  for(let i=2;i>=0;i--){
    const s=ex.fns[i]; if(!s.visible) continue;
    s.pts.forEach((p,k)=>items.push({f:i,k:k,x:p.x,y:p.y}));
  }
  if(gHit.childNodes.length!==items.length){
    gHit.innerHTML=items.map(it=>'<circle class="hit" r="18" data-f="'+it.f+'" data-k="'+it.k+'" cx="'+f1(px(it.x))+'" cy="'+f1(py(it.y))+'"/>').join('');
  } else {
    items.forEach((it,n)=>{
      const c=gHit.childNodes[n];
      c.setAttribute('cx',f1(px(it.x)));c.setAttribute('cy',f1(py(it.y)));
      c.setAttribute('data-f',it.f);c.setAttribute('data-k',it.k);
    });
  }
}
function renderExplore(){
  ex.fns.forEach(s=>{s.a=analyze(s.pts);});
  const fs=ex.fns.map(s=>(s.visible&&s.a.kind==='poly')?(x=>hornerN(s.a.cn,x)):null);
  let curves='', guide='', marks='';
  fs.forEach((f,i)=>{if(f) curves+='<path class="curve st'+i+'" d="'+curvePath(f)+'"/>';});
  ex.fns.forEach(s=>{
    if(s.visible&&s.a.kind==='vertical') s.a.dups.forEach(x=>{guide+='<line class="vline" x1="'+f1(px(x))+'" y1="5" x2="'+f1(px(x))+'" y2="595"/>';});
  });
  const inter=computeInter(fs);
  let rings='';
  let shown=0;
  const interPts=[];
  inter.list.forEach(it=>{ if(!it.res.same) it.res.pts.forEach(p=>{
    if(Math.abs(p.x)<=R+0.01&&Math.abs(p.y)<=R+0.5&&shown<12){
      shown++; interPts.push(p);
      rings+='<circle class="ring" cx="'+f1(px(p.x))+'" cy="'+f1(py(p.y))+'" r="12"/>';
    }
  });});
  for(let i=2;i>=0;i--){

  });
  gCurve.innerHTML=curves; gGuide.innerHTML=guide;
  gPts.innerHTML=rings+marks+placeLabels(labels.slice(0,14));
  syncHits();
  // 오른쪽 쪽
  const hadFocus=document.activeElement&&document.activeElement.name==='exAct';
  $('exSlots').innerHTML=[0,1,2].map(exSlotHTML).join('');

/* ---------- 모드 3: 퀴즈 ---------- */
const quiz={level:1,score:0,total:0,streak:0,q:null,answered:false,ok:false,hint:false,userVal:null,chosen:-1,lastType:null};
function genCoeffs(L){
  if(L===1) return [rnd(-5,5),pick([-3,-2,-1,1,2,3])];
  if(L===2) return [rnd(-4,4),rnd(-3,3),pick([-2,-1,1,2])];
  return [rnd(-3,3),rnd(-3,3),rnd(-2,2),pick([-1,1])];
}
function latticePts(co){
  const res=[];
  [0,1,-1,2,-2,3,-3,4,-4].forEach(x=>{
    const y=evalI(co,x);
    if(res.length<4 && Math.abs(y)<=10) res.push({x:x,y:y});
  });
  return res;
}
function distractors(co){
  const map={}; map[coKey(co)]=co;
  let count=1; const n=co.length;
  for(let t=0;t<120 && count<4;t++){
    const i=rnd(0,n-1);
    const c=co.slice();
    if(Math.random()<0.25) c[i]=-c[i]; else c[i]+=pick([-2,-1,1,2]);
    if(c[n-1]===0) continue;
    if(c.some(v=>Math.abs(v)>6)) continue;
    const k=coKey(c);
    if(!map[k]){map[k]=c;count++;}
  }
  return Object.keys(map).map(k=>map[k]);
}
function newQuestion(){
  const L=quiz.level;
  const types=L===1?['value','read','inverse','pick']:L===2?['value','read','pick']:['value','read'];
  let type, guard=0;
  do{type=pick(types);}while(type===quiz.lastType && ++guard<12);
  const xr=L===1?5:L===2?4:3;
  for(let t=0;t<500;t++){
    const co=genCoeffs(L);
    const x0=rnd(-xr,xr);
    if(x0===0) continue;
    const y0=evalI(co,x0);
    if(Math.abs(y0)>9) continue;
    const q={type:type,co:co,x0:x0,y0:y0};
    if(type==='pick'){
      const marks=latticePts(co);
      if(marks.length<3) continue;
      const opts=distractors(co);
      if(opts.length<4) continue;
      shuffle(opts);
      q.marks=marks; q.opts=opts; q.correct=opts.findIndex(o=>coKey(o)===coKey(co));
    }
    quiz.q=q; quiz.lastType=type; return;
  }
  quiz.q={type:'value',co:[2,3],x0:3,y0:11}; quiz.lastType='value';
}
function showQuestion(focus){
  const q=quiz.q;
  quiz.answered=false; quiz.ok=false; quiz.hint=false; quiz.userVal=null; quiz.chosen=-1;
  const prompts={
    value:'아래 식에서 x = '+fmt(q.x0)+' 일 때, y는 얼마일까요?',

    inverse:'아래 식에서 y = '+fmt(q.y0)+' 일 때, x는 얼마일까요?',
    pick:'그래프가 지나가는 점을 보고, 알맞은 식을 골라 보세요.'
  };
  const tips={
    value:'식의 x 자리에 '+fmt(q.x0)+'을 넣어 계산해 보세요. 막히면 힌트로 그래프를 볼 수 있어요.',
    read:'노란 세로선을 따라 올라가거나 내려가서, 곡선과 만나는 곳의 높이를 읽어요.',
    inverse:'노란 가로선은 y = '+fmt(q.y0)+' 인 높이예요. 막히면 힌트로 그래프를 볼 수 있어요.',
    pick:'표시된 점의 x, y를 식에 넣어서 맞는지 확인해 보세요.'
  };
  $('qPrompt').textContent=prompts[q.type];

  const isPick=q.type==='pick';
  $('qForm').hidden=isPick;

  $('qIn').value=''; $('qIn').disabled=false;

  $('hintBtn').hidden=!(q.type==='value'||q.type==='inverse');
  $('qFb').hidden=true; $('nextBtn').hidden=true; $('qMsg').textContent='';
  render();
  if(focus && !isPick) setTimeout(()=>$('qIn').focus({preventScroll:true}),0);
}
function finish(ok,userVal,chosen){
  const q=quiz.q;
  quiz.answered=true; quiz.ok=ok; quiz.userVal=userVal; quiz.chosen=chosen;
  quiz.total++; if(ok){quiz.score++;quiz.streak++;} else quiz.streak=0;
  const head=ok?(quiz.streak>=3?'정답이에요! '+quiz.streak+'연속 성공':'정답이에요!'):'아쉬워요, 같이 확인해 봐요.';
  let ans, calc;
  if(q.type==='pick'){
    const m=q.marks[Math.min(1,q.marks.length-1)];
    ans='정답: '+intPoly(q.co);
    calc='확인: x = '+fmt(m.x)+' 일 때 y = '+substitution(q.co,m.x)+' = '+fmt(m.y);
  } else {
    const target=q.type==='inverse'?q.x0:q.y0;
    ans='정답: '+(q.type==='inverse'?'x':'y')+' = '+fmt(target);
    calc='x = '+fmt(q.x0)+' 일 때 y = '+substitution(q.co,q.x0)+' = '+fmt(q.y0);
    if(q.type==='read') calc+=' · 이 그래프의 식: '+intPoly(q.co);
  }
  const fb=$('qFb');
  fb.className='fb '+(ok?'good':'bad');
  fb.innerHTML='<div class="fb-h">'+head+'</div><div class="fb-a">'+ans+'</div><div class="fb-c">'+calc+'</div>';
  fb.hidden=false;
  $('qIn').disabled=true; $('checkBtn').hidden=true; $('hintBtn').hidden=true;
  $('nextBtn').hidden=false;
  if(q.type==='pick'){
    document.querySelectorAll('#qOpts .opt').forEach((b,i)=>{
      b.disabled=true;
      if(i===q.correct) b.classList.add('good'); else if(i===chosen) b.classList.add('bad');
    });
  }
  render();
  $('nextBtn').focus({preventScroll:true});
}
function checkNumeric(){
  const q=quiz.q;
  if(quiz.answered) return;
  const raw=$('qIn').value.trim();
  if(raw===''||!isFinite(Number(raw))){say('qMsg','답을 숫자로 써 주세요.');return;}
  const v=Number(raw);
  finish(v===(q.type==='inverse'?q.x0:q.y0),v,-1);
}
function nextQuestion(){ newQuestion(); showQuestion(true); }
function renderQuiz(){
  const q=quiz.q; if(!q) return;
  const showCurve=q.type==='read'||q.type==='pick'||quiz.hint||quiz.answered;
  const curve=showCurve?'<path class="curve st0" d="'+curvePath(x=>evalI(q.co,x))+'"/>':'';
  let guide='', pp='';

    guide+='<text class="tag" x="'+f1(px(q.x0))+'" y="'+(CY+44)+'" text-anchor="middle">x = '+fmt(q.x0)+'</text>';
  } else if(q.type==='inverse'){
    guide+='<line class="guide" x1="5" y1="'+f1(py(q.y0))+'" x2="795" y2="'+f1(py(q.y0))+'"/>';
    guide+='<text class="tag" x="'+(CX+14)+'" y="'+f1(py(q.y0)-10)+'">y = '+fmt(q.y0)+'</text>';
  }
  if(q.type==='pick'){
    q.marks.forEach(m=>{pp+=shape(0,m.x,m.y);labels.push({x:m.x,y:m.y,text:ptStr(m.x,m.y)});});
  } else if(quiz.answered){
    pp+='<circle class="qgood" cx="'+f1(px(q.x0))+'" cy="'+f1(py(q.y0))+'" r="4"/>';
    labels.push({x:q.x0,y:q.y0,text:ptStr(q.x0,q.y0)});
    if(!quiz.ok && quiz.userVal!==null){
      const ux=q.type==='inverse'?quiz.userVal:q.x0, uy=q.type==='inverse'?q.y0:quiz.userVal;
      if(Math.abs(ux)<=R+0.5 && Math.abs(uy)<=R+0.5){
        pp+='<circle class="qring bad" cx="'+f1(px(ux))+'" cy="'+f1(py(uy))+'" r="4.5"/>';
        labels.push({x:ux,y:uy,text:'내 답',cls:'bad'});
      }
    }
  } else if(showCurve){
    pp+='<circle class="qring" cx="'+f1(px(q.x0))+'" cy="'+f1(py(q.y0))+'" r="4.5"/>';
    labels.push({x:q.x0,y:q.y0,text:'?'});
  }
  gCurve.innerHTML=curve; gGuide.innerHTML=guide; gPts.innerHTML=pp+placeLabels(labels); gGhost.innerHTML='';
}

/* ---------- 범위 바꾸기 ---------- */
function setRange(r){
  if(r===R) return;
  if(mode==='explore' && ex.fns.some(s=>s.pts.some(p=>Math.abs(p.x)>r||Math.abs(p.y)>r))){
    say('exMsg','범위 밖에 점이 있어서 줄일 수 없어요. 점을 안쪽으로 옮겨 주세요.'); return;
  }
  if(mode==='points' && pt.pts.some(p=>Math.abs(p.x)>r||Math.abs(p.y)>r)){
    say('ptMsg','범위 밖에 점이 있어서 줄일 수 없어요. 그 점을 지워 주세요.'); return;
  }
  R=r; UX=380/R; UY=280/R;
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.r)===R)));
  drawStatic(); syncFmSlider(); render();
}

/* ---------- 그래프판 입력 ---------- */
function lattice(e){
  const r=svg.getBoundingClientRect();
  const sx=(e.clientX-r.left)*800/r.width, sy=(e.clientY-r.top)*600/r.height;
  return {x:clamp(Math.round((sx-CX)/UX),-R,R), y:clamp(Math.round((CY-sy)/UY),-R,R)};
}
let cand=null, drag=null, tap=null;
svg.addEventListener('pointerdown',e=>{
  if(mode==='explore' && e.target.classList && e.target.classList.contains('hit')){
    cand={f:Number(e.target.dataset.f),k:Number(e.target.dataset.k),x:e.clientX,y:e.clientY};
    try{svg.setPointerCapture(e.pointerId);}catch(err){}
    e.preventDefault();
    return;
  }
  tap={x:e.clientX,y:e.clientY,id:e.pointerId};
});
svg.addEventListener('pointermove',e=>{
  if(cand && !drag && Math.hypot(e.clientX-cand.x,e.clientY-cand.y)>6){
    drag={f:cand.f,k:cand.k}; ex.active=drag.f; ex.example=false; gGhost.innerHTML='';
  }
  if(drag){
    const l=lattice(e), s=ex.fns[drag.f], p=s.pts[drag.k];
    if(p && (l.x!==p.x||l.y!==p.y) && !s.pts.some((q,i)=>i!==drag.k&&q.x===l.x&&q.y===l.y)){
      p.x=l.x; p.y=l.y; renderExplore(); updateFoot();
    }
    return;
  }
  if(tap && Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>10) tap=null;
  const l=lattice(e);
  $('cursor').textContent='커서 '+ptStr(l.x,l.y);
  if((mode==='explore'||mode==='points') && e.pointerType==='mouse' && !cand){
    if(e.target.classList && e.target.classList.contains('hit')){gGhost.innerHTML='';return;}
    gGhost.innerHTML='<circle class="ghost-mk" cx="'+f1(px(l.x))+'" cy="'+f1(py(l.y))+'" r="7"/>';
  }
});
svg.addEventListener('pointerup',e=>{
  if(drag){drag=null;cand=null;renderExplore();updateFoot();return;}
  if(cand){
    const c=cand; cand=null;
    const l=lattice(e), p=ex.fns[c.f].pts[c.k];
    ex.active=c.f;
    if(p && (p.x!==l.x||p.y!==l.y)) addPoint(l.x,l.y);
    else if(p){ ex.fns[c.f].pts.splice(c.k,1); ex.example=false; render(); say('exMsg','점을 지웠어요. 판을 눌러 다시 찍을 수 있어요.'); }
    else {renderExplore();updateFoot();}
    return;
  }
  if(tap && tap.id===e.pointerId){
    tap=null;
    const l=lattice(e);
    if(mode==='points') ptTap(l.x,l.y);
    else if(mode==='explore') addPoint(l.x,l.y);
    else if(mode==='formula'){ fm.x=l.x; $('fmX').value=l.x; renderFormula(); }
  }
});
svg.addEventListener('pointercancel',()=>{ if(drag){drag=null;renderExplore();} cand=null; tap=null; });
svg.addEventListener('pointerleave',()=>{ gGhost.innerHTML=''; $('cursor').textContent='커서 —'; });

  if(pt.pts.some(p=>p.x===x&&p.y===y)){ say('ptMsg','이미 그 자리에 점이 있어요.'); return; }
  if(pt.pts.length>=PT_MAX){ say('ptMsg','점은 '+PT_MAX+'개까지 찍을 수 있어요.'); return; }
  const p={x:x,y:y}; pt.pts.push(p); pt.last=p; $('ptX').value=''; $('ptY').value=''; render(); $('ptX').focus();
});
$('ptChips').addEventListener('click',e=>{
  const b=e.target.closest('button[data-pk]'); if(!b) return;
  pt.pts.splice(Number(b.dataset.pk),1); pt.last=pt.pts.length?pt.pts[pt.pts.length-1]:null; render();
});
$('ptClear').addEventListener('click',()=>{pt.pts=[];pt.last=null;render();});
$('ptOpts').addEventListener('click',e=>{
  const b=e.target.closest('.opt'); if(!b||pt.answered) return;
  pt.picked=Number(b.dataset.i); ptResolve(pt.picked===pt.q.correct); render();
});
$('ptShow').addEventListener('click',()=>{ if(pt.answered) return; pt.revealed=true; ptResolve(false); render(); });
$('ptNext').addEventListener('click',()=>{ ptNewQ(); render(); });
$('ptReset').addEventListener('click',()=>{ pt.score=0;pt.total=0;pt.streak=0; updateFoot(); });

// 점 → 함수식
$('exSlots').addEventListener('change',e=>{
  if(e.target.name==='exAct') setActive(Number(e.target.value));
});
$('exSlots').addEventListener('click',e=>{
  const chip=e.target.closest('button[data-k]');
  if(chip){
    ex.fns[Number(chip.dataset.f)].pts.splice(Number(chip.dataset.k),1); ex.example=false; render(); return;
  }
  const act=e.target.closest('button[data-act]');
  if(act){
    const i=Number(act.dataset.i), s=ex.fns[i];
    if(act.dataset.act==='hide') s.visible=!s.visible; else {s.pts=[];s.visible=true;}
    ex.example=false; render();
  }
});
$('coordForm').addEventListener('submit',e=>{
  e.preventDefault();
  const xs=$('inX').value.trim(), ys=$('inY').value.trim();
  const x=Number(xs), y=Number(ys);
  if(xs===''||ys===''||!Number.isInteger(x)||!Number.isInteger(y)||Math.abs(x)>R||Math.abs(y)>R){
    say('exMsg','x와 y에 −'+R+'부터 '+R+'까지의 정수를 써 주세요.'); return;
  }
  if(addPoint(x,y)){ $('inX').value=''; $('inY').value=''; $('inX').focus(); }
});
document.querySelectorAll('[data-ex]').forEach(b=>b.addEventListener('click',()=>{
  const arr=EXS[b.dataset.ex];
  if(arr.some(p=>Math.abs(p[0])>R||Math.abs(p[1])>R)){say('exMsg','범위를 넓히면 불러올 수 있어요.');return;}
  ex.fns[ex.active]=mkSlot(arr); render();
}));
$('clearAll').addEventListener('click',()=>{ex.fns.forEach(s=>{s.pts=[];s.visible=true;});ex.example=false;render();});

// 식 → 그래프
buildFmSlots();
fm.fns.forEach((s,i)=>readCo(i));
$('fmSlots').addEventListener('input',e=>{
  const t=e.target; if(!t.classList.contains('cf')) return;
  const i=Number(t.dataset.i); fm.fns[i].v[Number(t.dataset.k)]=t.value; fm.fns[i].visible=true;
  readCo(i); renderFormula(); updateFoot();
});
$('fmSlots').addEventListener('click',e=>{
  const act=e.target.closest('button[data-act]'); if(!act) return;
  const i=Number(act.dataset.i), s=fm.fns[i];
  if(act.dataset.act==='hide') s.visible=!s.visible;
  else { s.v=['','','','']; document.querySelectorAll('#fmSlots li:nth-child('+(i+1)+') .cf').forEach(inp=>{inp.value='';}); readCo(i); s.visible=true; }
  render();
});
$('fmX').addEventListener('input',()=>{fm.x=Number($('fmX').value);renderFormula();});

// 퀴즈
document.querySelectorAll('.lv').forEach(b=>b.addEventListener('click',()=>{
  quiz.level=Number(b.dataset.lv);
  document.querySelectorAll('.lv').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  nextQuestion();
}));
$('qForm').addEventListener('submit',e=>{e.preventDefault();checkNumeric();});
$('qIn').addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();checkNumeric();} });
$('qOpts').addEventListener('click',e=>{
  const b=e.target.closest('.opt'); if(!b||quiz.answered) return;
  const i=Number(b.dataset.i);
  finish(i===quiz.q.correct,null,i);
});
$('hintBtn').addEventListener('click',()=>{quiz.hint=true;$('hintBtn').hidden=true;renderQuiz();});
$('nextBtn').addEventListener('click',nextQuestion);
$('resetScore').addEventListener('click',()=>{quiz.score=0;quiz.total=0;quiz.streak=0;updateFoot();});

// 전체 화면
const fullBtn=$('fullBtn'), docEl=document.documentElement;
const canFull=!!(docEl.requestFullscreen||docEl.webkitRequestFullscreen);
const isFull=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function paintFull(){
  const on=isFull();
  fullBtn.setAttribute('aria-pressed',String(on));
  fullBtn.setAttribute('aria-label',on?'전체 화면 끄기':'전체 화면 켜기');
  fullBtn.title=on?'전체 화면 끄기':'전체 화면';
}
if(!canFull){ fullBtn.hidden=true; }
fullBtn.addEventListener('click',()=>{
  const fail=()=>say('barNote','이 화면에서는 전체 화면을 쓸 수 없어요. 파일이나 웹 주소로 직접 열어 보세요.');
  try{
    let r;
    if(isFull()) r=(document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else r=(docEl.requestFullscreen||docEl.webkitRequestFullscreen).call(docEl);
    if(r&&r.catch) r.catch(fail);
  }catch(err){ fail(); }
});
document.addEventListener('fullscreenchange',paintFull);
document.addEventListener('webkitfullscreenchange',paintFull);
paintFull();

// 글자 크기, 야간 모드
const app=$('app');
function isNight(){
  if(app.classList.contains('night')) return true;
  if(app.classList.contains('day')) return false;
  const root=document.documentElement.getAttribute('data-theme');
  if(root==='dark') return true;
  if(root==='light') return false;
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function paintThemeBtn(){
  const n=isNight(); const b=$('themeBtn');
  b.textContent=n?'주간 모드':'야간 모드'; b.setAttribute('aria-pressed',String(n));
}
function setTheme(t){
  app.classList.remove('day','night'); if(t) app.classList.add(t);
  document.body.style.background=getComputedStyle(app).getPropertyValue('--desk');
  paintThemeBtn();
  try{ if(t) localStorage.setItem('fxm-theme',t); }catch(err){}
}
$('themeBtn').addEventListener('click',()=>setTheme(isNight()?'day':'night'));
let big=false;
function setBig(v){
  big=v; document.documentElement.style.setProperty('--fs',v?'1.15':'1');
  $('fsBtn').setAttribute('aria-pressed',String(v));
  try{ localStorage.setItem('fxm-big',v?'1':'0'); }catch(err){}
}
$('fsBtn').addEventListener('click',()=>setBig(!big));
try{
  const t=localStorage.getItem('fxm-theme'); if(t==='day'||t==='night') setTheme(t);
  if(localStorage.getItem('fxm-big')==='1') setBig(true);
}catch(err){}
paintThemeBtn();

/* ---------- 시작 ---------- */
drawStatic();
newQuestion();
showQuestion(false);
setMode('points');
})();
</script>
